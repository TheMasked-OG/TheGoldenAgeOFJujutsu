<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Jujutsu Kaisen cursed energy emblem">
  <style>
    .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
  </style>

  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#b06bff" stop-opacity=".55"/>
      <stop offset="55%"  stop-color="#6a2fbf" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#6a2fbf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#b06bff"/>
      <stop offset="50%"  stop-color="#f2efe9"/>
      <stop offset="100%" stop-color="#c8102e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0d0d0f"/>
  <circle class="pulse" cx="256" cy="256" r="238" fill="url(#aura)"/>

  <g filter="url(#glow)" opacity=".85">
    <circle cx="256" cy="256" r="222" fill="none" stroke="#6a2fbf" stroke-width="2"
            stroke-dasharray="140 76" transform="rotate(-90 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#b06bff" stroke-width="1.5"
          stroke-dasharray="6 10" opacity=".55"/>

  <g filter="url(#glow)">
    <path d="M166 256 Q256 180 346 256" fill="none" stroke="#f2efe9"
          stroke-width="4" stroke-linecap="round"/>
    <path d="M166 256 Q256 332 346 256" fill="none" stroke="#f2efe9"
          stroke-width="4" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="34" fill="#0d0d0f" stroke="#b06bff" stroke-width="4"/>
    <circle cx="256" cy="256" r="13" fill="#c8102e"/>
    <circle cx="268" cy="244" r="5" fill="#f2efe9"/>
  </g>

  <text x="256" y="378" text-anchor="middle" fill="#f2efe9"
        font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif"
        font-size="44" letter-spacing="4">呪術廻戦</text>
  <text x="256" y="414" text-anchor="middle" fill="#b06bff"
        font-family="system-ui,sans-serif" font-size="13" letter-spacing="4">JUJUTSU KAISEN</text>
</svg>
